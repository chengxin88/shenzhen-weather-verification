<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>气象模式检验 · 测试平台</title><link rel="stylesheet" href="./style.css?v=station-pick-20261111"><link rel="stylesheet" href="./case.css?v=case-page-20261111"><link rel="stylesheet" href="./typhoon.css?v=compact-20261112"><link rel="stylesheet" href="./monthly.css?v=scale-20261111"><link rel="stylesheet" href="./model-interfaces.css?v=font-larger-20261018"><link rel="stylesheet" href="./demo-models.css?v=20261013"><link rel="stylesheet" href="./quality.css?v=board-20261110"><link rel="stylesheet" href="./stations.css?v=detail-20261109"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="./"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M3 24h5l6-15 7 23 6-17 6 9"/></svg><span>气象检验平台<small>WEATHER VERIFICATION</small></span></a>
  <p class="nav-label">检验工作台</p>
  <nav aria-label="考核总览"><button type="button" data-module="overview" class="nav-item" aria-pressed="false"><span aria-hidden="true">▤</span>考核总览</button><button type="button" data-module="nowcast" class="nav-item" aria-pressed="false"><span aria-hidden="true">▥</span>临近降水</button></nav>
  <p class="nav-label">详细分析</p>
  <nav id="detail-nav" class="detail-nav" aria-label="详细分析指标"><div id="detail-nav-tree"></div></nav>
  <p class="nav-label">专项检验</p>
  <nav class="specialist-nav" aria-label="专项检验"><button type="button" data-module="case" class="nav-item" aria-pressed="false"><span aria-hidden="true">◎</span>个例检验</button><button type="button" data-module="typhoon" class="nav-item" aria-pressed="false"><span aria-hidden="true">◉</span>台风检验</button><button type="button" data-module="monthly" class="nav-item" aria-pressed="false"><span aria-hidden="true">▦</span>月降水检验</button></nav>
  <p class="nav-label">数据管理</p><nav aria-label="数据管理"><button type="button" data-module="quality" class="nav-item" aria-pressed="false"><span aria-hidden="true">✓</span>数据质控</button></nav>
  <p class="nav-label">关联平台</p><a class="nav-link" href="/Verification/compare/" target="_blank" rel="noopener noreferrer">模式预报对比地图 ↗</a><a class="nav-link" href="/Verification/compare/case/" target="_blank" rel="noopener noreferrer">历史个例对比地图 ↗</a><a class="nav-link" href="/Verification/" target="_self">原平台 →</a>
  <div class="sidebar-bottom">SZVERIFY <span>试验版 02</span></div>
</aside>
<div class="workspace">
  <header class="topbar"><div>模式评估 <span>/</span> 检验工作台 <b class="badge">TEST</b></div><nav class="topbar-actions" aria-label="平台操作"><a class="quiet" href="/Verification/" target="_self">原平台 →</a><button id="refresh" class="quiet">↻ 刷新资料</button></nav></header>
  <main>
    <section id="overview-workspace" hidden aria-label="考核总览"></section>
    <section id="nowcast-workspace" hidden aria-label="临近降水"></section>
    <section id="module-demo-mode" aria-label="WN3演示资料说明" hidden></section>
    <section id="case-workspace" hidden aria-label="个例检验"></section>
    <section id="monthly-workspace" hidden aria-label="月降水检验"></section>
    <section id="typhoon-workspace" hidden aria-label="台风检验"></section>
    <section id="interfaces-workspace" hidden aria-label="模式接入"></section>
    <section id="quality-workspace" hidden aria-label="数据质控"></section>
    <section id="stations-workspace" class="stations-view" hidden aria-label="站点检验"></section>
    <div id="grid-workspace">
      <div class="page-heading detail-heading">
        <div class="page-heading-main"><div><h1 id="page-title">详细分析</h1><p id="page-subtitle"></p></div></div>
        <div id="catalog-status-wrap" class="coverage-label"><span id="catalog-status" role="status">读取资料…</span></div>
      </div>
      <div id="load-error" class="notice error" hidden></div>
      <div class="detail-mobile-bar"><label for="detail-page-select">指标</label><select id="detail-page-select" aria-label="选择要素和指标"></select></div>
      <section class="filter-card detail-filter-card" aria-label="检验条件">
        <div class="detail-filters">
          <div class="filter-field detail-date-field"><span>日期 · 北京时间</span><div class="detail-date-row"><input id="start" type="date" aria-label="开始日期" title="开始日期"><span aria-hidden="true">至</span><input id="end" type="date" aria-label="结束日期" title="结束日期"></div></div>
          <div class="filter-field detail-preset-field"><span>快捷</span><div id="date-presets" class="choice-buttons" role="group" aria-label="日期范围"></div></div>
          <div class="filter-field"><span>起报时次</span><div id="hour-switch" class="choice-buttons" role="group" aria-label="起报时次"></div></div>
          <div id="accumulation-field" class="filter-field" hidden><span>累积</span><div id="accumulation-switch" class="choice-buttons" role="group" aria-label="累积时长"></div></div>
          <div id="threshold-field" class="filter-field" hidden><span>阈值 (mm)</span><div id="threshold-switch" class="choice-buttons" role="group" aria-label="降水阈值"></div></div>
          <div id="reference-field" class="filter-field" hidden><span>检验对象</span><div id="reference-switch" class="choice-buttons" role="group" aria-label="检验对象"></div></div>
          <div id="region-field" class="filter-field" hidden><span>区域</span><div id="region-switch" class="choice-buttons" role="group" aria-label="检验区域"></div></div>
          <div id="station-field" class="filter-field" hidden><span>单站</span><div class="station-pick-row"><input id="station-pick" type="text" list="station-pick-list" placeholder="输入站名或站号" autocomplete="off" spellcheck="false" aria-label="选择单个站点，只看该站评分"><datalist id="station-pick-list"></datalist><button id="station-score-reset" type="button" class="quiet" hidden>返回区域</button></div></div>
          <div id="reference-dataset-field" class="filter-field" hidden><span>参考资料</span><select id="reference-dataset" aria-label="参考资料"></select></div>
          <div id="circulation-level-field" class="filter-field" hidden><span>气压层</span><select id="circulation-level" aria-label="气压层"></select></div>
          <div class="filter-field detail-model-field"><span>模式</span><div class="detail-model-line"><div id="models" class="model-system-groups" role="group" aria-label="比较模式"></div><button id="models-default" type="button" class="quiet">默认模式</button></div></div>
        </div>
        <p id="filter-note" class="filter-note current-source"></p>
        <div id="legacy-controls" class="legacy-controls" hidden>
          <select id="dataset" aria-label="内部归档状态"></select>
          <select id="metric" aria-label="当前指标状态"></select>
          <select id="threshold" aria-label="降水阈值状态"></select>
          <select id="lead" aria-label="预报时效状态"></select>
          <select id="hour" aria-label="起报时次状态"><option value="all">全部时次</option><option value="08">08时</option><option value="20">20时</option></select>
          <select id="single" aria-label="单模式状态"></select>
          <select id="time-mode" aria-label="时序维度状态"><option value="models">多模式</option><option value="leads">单模式</option></select>
          <select id="verification-mode" aria-label="检验方式状态"><option value="cumulative">累加</option><option value="grade">分级</option></select>
          <label id="verification-mode-label" hidden>检验方式</label>
          <label id="lead-label" hidden>预报时效</label>
          <label id="metric-label" hidden>评分指标</label>
          <label id="threshold-label" hidden>降水阈值</label>
          <label id="single-label" hidden>模式</label>
          <label id="time-mode-label" hidden>时序对比维度</label>
          <div id="chart-lead-quick" hidden></div>
          <div id="score-scope-field" hidden></div>
          <div id="valid-label" hidden></div>
          <input type="checkbox" id="common" checked>
          <input type="checkbox" id="across-leads">
        </div>
      </section>
      <section class="results" id="detail-results">
        <div class="result-heading">
          <div><h2 id="chart-title">读取评分…</h2><p id="chart-subtitle"></p></div>
          <div class="chart-actions">
            <div id="chart-mode-toggle" class="detail-mode-toggle" role="group" aria-label="横轴"><button type="button" data-chart-mode="lead" aria-pressed="true">随预报时效</button><button type="button" data-chart-mode="date" aria-pressed="false">随日期</button><button type="button" data-chart-mode="threshold" aria-pressed="false" hidden>按阈值</button></div>
            <label id="date-lead-label" class="date-lead-label" hidden>固定时效<select id="date-lead" aria-label="固定预报时效"></select></label>
            <button id="export-svg" class="quiet">导出图表 ↓</button>
          </div>
        </div>
        <div id="legend" class="legend"></div>
        <div id="chart" class="chart" role="region" aria-label="检验图表"></div>
        <div id="chart-explainer" class="chart-explainer"></div>
      </section>
      <section class="table-card" id="detail-table-card">
        <div class="table-heading"><div><h2 id="table-title">模式 × 时效</h2><p id="table-note"></p></div><button id="export-csv" class="quiet">导出 CSV ↓</button></div>
        <div class="table-scroll detail-table-scroll" id="results-table-wrap"><table id="results-table"></table></div>
      </section>
      <div id="grid-station-view" class="stations-view" hidden></div>
      <footer><span id="updated"></span></footer>
    </div>
  </main>
</div>

<script src="./stations.js?v=retain16-20261116"></script>

<script src="./nowcast.js?v=window15-20261114"></script>
<script src="./modules.js?v=nostations-20261112"></script>
<script src="./grid-stations.js?v=station-pick-20261111"></script>
</body></html>
